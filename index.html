<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADRASAH NOTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* কালার ও থিম ডিজাইন */
        :root {
            --bg-color: #0f1115; --gold-color: #d4af37; --white-text: #ffffff;
            --card-bg: #1a1d24; --border-color: rgba(212, 175, 55, 0.2);
        }
        [data-theme="light"] {
            --bg-color: #f4f6f9; --gold-color: #a68926; --white-text: #2c3e50;
            --card-bg: #ffffff; --border-color: rgba(166, 137, 38, 0.3);
        }

        * { box-sizing: border-box; }
        body { margin: 0; background-color: var(--bg-color); color: var(--white-text); font-family: 'Noto Serif Bengali', serif; transition: 0.3s; }
        
        /* ন্যাভিগেশন বার */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: var(--bg-color); position: sticky; top: 0; border-bottom: 1px solid var(--border-color); z-index: 1000;}
        .logo { font-size: 1.4rem; color: var(--gold-color); font-weight: bold; cursor: pointer; }
        .theme-toggle { cursor: pointer; font-size: 1.5rem; background: none; border: none; color: var(--gold-color); }
        
        /* সেকশন ডিজাইন */
        .content-section { display: none; padding: 40px 5%; max-width: 800px; margin: auto; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        #home-section.active { height: 75vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* বাটন ও লিস্ট */
        .btn, .category-btn { background: var(--card-bg); color: var(--gold-color); padding: 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border-color); font-weight: bold; font-size: 1.2rem; text-align: center; display: block; width: 100%; margin-bottom: 15px; font-family: inherit; transition: 0.2s;}
        .btn:hover, .category-btn:hover { background: var(--gold-color); color: #fff; }
        
        .back-btn { width: auto; display: inline-block; padding: 10px 20px; font-size: 1rem; margin-bottom: 25px; }
        
        .list-item { background: var(--card-bg); padding: 18px; margin-bottom: 15px; border-radius: 8px; cursor: pointer; border-left: 4px solid var(--gold-color); font-size: 1.1rem; transition: 0.2s;}
        .list-item:hover { transform: translateX(5px); }

        /* বিস্তারিত পড়ার কার্ড */
        .q-card { background: var(--card-bg); padding: 25px; border-radius: 12px; border-top: 5px solid var(--gold-color); line-height: 1.8; text-align: justify; font-size: 1.15rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showSection('home-section')">Madrasah Note</div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
    </nav>

    <!-- ১. হোম পেজ -->
    <section id="home-section" class="content-section active">
        <h1 style="font-size: 2.2rem; margin-bottom: 5px;">Madrasah <span style="color:var(--gold-color)">Note</span></h1>
        <p style="opacity: 0.8; margin-bottom: 30px;">By Enayet Karim & Khubaib Ahmad</p>
        <button class="category-btn" style="width: auto; padding: 15px 40px; border-radius: 30px;" onclick="showSection('subjects-list')">পড়া শুরু করুন ➔</button>
    </section>

    <!-- ২. বিষয়সমূহ -->
    <section id="subjects-list" class="content-section">
        <button class="btn back-btn" onclick="showSection('home-section')">← হোম পেজে যান</button>
        <h2 style="color: var(--gold-color); text-align: center; margin-bottom: 25px;">বিষয় নির্বাচন করুন</h2>
        <button class="category-btn" onclick="showSection('tarjoma-cats')">তরজমা</button>
        <button class="category-btn" style="opacity: 0.6; cursor: not-allowed;">হাদীছ শরীফ (শীঘ্রই)</button>
        <button class="category-btn" style="opacity: 0.6; cursor: not-allowed;">আরবী (শীঘ্রই)</button>
        <button class="category-btn" style="opacity: 0.6; cursor: not-allowed;">আক্বাইদ ফিক্বহ (শীঘ্রই)</button>
    </section>

    <!-- ৩. তরজমা ক্যাটাগরি -->
    <section id="tarjoma-cats" class="content-section">
        <button class="btn back-btn" onclick="showSection('subjects-list')">← বিষয়ে ফিরে যান</button>
        <h2 style="color: var(--gold-color); text-align: center; margin-bottom: 25px;">ক্যাটাগরি নির্বাচন করুন</h2>
        <button class="category-btn" onclick="showSection('boroprosno-list')">বড় প্রশ্ন</button>
        <button class="category-btn" onclick="showSection('shanenuyul-list')">শানে নুযূল</button>
        <button class="category-btn" style="opacity: 0.6; cursor: not-allowed;">তাহক্বীক (শীঘ্রই)</button>
        <button class="category-btn" style="opacity: 0.6; cursor: not-allowed;">ব্যাখ্যা (শীঘ্রই)</button>
    </section>

    <!-- ৪. বড় প্রশ্নসমূহ -->
    <section id="boroprosno-list" class="content-section">
        <button class="btn back-btn" onclick="showSection('tarjoma-cats')">← ক্যাটাগরিতে যান</button>
        <h2 style="color: var(--gold-color); margin-bottom: 20px;">বড় প্রশ্নসমূহ</h2>
        <div class="list-item" onclick="showDetail('ans1')">১. মক্কী ও মাদানী সূরা বলতে কী বুঝায়?</div>
    </section>

    <!-- ৪. শানে নুযূল -->
    <section id="shanenuyul-list" class="content-section">
        <button class="btn back-btn" onclick="showSection('tarjoma-cats')">← ক্যাটাগরিতে যান</button>
        <h2 style="color: var(--gold-color); margin-bottom: 20px;">শানে নুযূল</h2>
        <div class="list-item" onclick="showDetail('shan15')">১৫. পবিত্র বদর জিহাদ উনার শানে নুযূল</div>
        <div class="list-item" onclick="showDetail('shan16')">১৬. পবিত্র উহুদ জিহাদ উনার সঠিক ইতিহাস</div>
    </section>

    <!-- ৫. বিস্তারিত পড়ার পেজ -->
    <section id="detail-view" class="content-section">
        <button id="dynamic-back-btn" class="btn back-btn">← ফিরে যান</button>
        <div class="q-card">
            <h3 id="detail-title" style="color:var(--gold-color); margin-top: 0;"></h3>
            <p id="detail-text"></p>
        </div>
    </section>

    <script>
        // থিম সিস্টেম
        let currentTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', currentTheme);
        document.getElementById('theme-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            document.getElementById('theme-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        // নেভিগেশন (পেজ পরিবর্তন)
        function showSection(id) {
            let sections = document.querySelectorAll('.content-section');
            sections.forEach(function(sec) {
                sec.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ডাটাবেজ (প্রশ্ন ও উত্তর)
        const notes = {
            ans1: { 
                parent: 'boroprosno-list', 
                title: "১. মক্কী ও মাদানী সূরা বলতে কী বুঝায়?", 
                content: "হিজরতের পূর্বে নাযিল হওয়া পবিত্র সূরাগুলো হলো মক্কী সূরা (৮৬টি)। আর হিজরতের পর নাযিল হওয়া সূরাগুলো হলো মাদানী সূরা (২৮টি)।" 
            },
            shan15: { 
                parent: 'shanenuyul-list', 
                title: "১৫. পবিত্র বদর জিহাদ উনার শানে নুযূল", 
                content: "দ্বিতীয় হিজরীর সম্মানিত ১৭ই রমাদ্বান শরীফে পবিত্র মদীনা শরীফ উনার থেকে ৮০ মাইল দূরে বদর নামক স্থানে এই সম্মানিত বদর জিহাদ সংঘটিত হন। এই সম্মানিত বদর জিহাদে মুসলমান উনাদের সংখ্যা ছিলেন ৩১৩ জন আর অপরদিকে কাফিরদের সংখ্যা ছিলো ১০০০ জন। এই সম্মানিত বদর জিহাদে ১৪ জন মুসলমান উনারা শহীদ হন, ৭০ জন কাফির মারা যায় এবং ৭০ জন কাফির বন্দি হয়। এছাড়া বাকি সমস্ত কাফির গুলো পালিয়ে যায়। আর মুসলমান উনারা বিজয় লাভ করেন। সুবহানাল্লাহ।" 
            },
            shan16: { 
                parent: 'shanenuyul-list', 
                title: "১৬. পবিত্র উহুদ জিহাদ উনার সঠিক ইতিহাস ও বিজয়", 
                content: "পবিত্র উহুদ জিহাদ মল্লযুদ্ধের মাধ্যমে শুরু হলে একপর্যায়ে তা কঠিনরূপ ধারণ করে, এতে কাফিররা দলে দলে পালিয়ে যেতে থাকে। একসময় পুরো ময়দান ফাঁকা হয়ে যায়। মুসলিম বাহিনী বিজয় হিসেবে জিহাদের মালামাল গুছানো শুরু করেন। এমতাবস্থায় জিহাদের নিয়ম-নীতি ভঙ্গ করে কাফিররা পিছন দিকের গিরিপথ দিয়ে আক্রমণ করে। এতে কাফিররা বিশৃঙ্খলা সৃষ্টির চেষ্টা করলেও তা ছিলো সাময়িক। মুহূর্তের মধ্যেই মুসলমান উনারা অপ্রস্তুত থাকা সত্ত্বেও কাফিরদের সমুচিত জওয়াব দেন। বিপুল ক্ষয়-ক্ষতি নিয়ে সমস্ত কাফিররা পুনরায় পালিয়ে যায়। নূরে মুজাসসাম হাবীবুল্লাহ হুযূর পাক ছল্লাল্লাহু আলাইহি ওয়া সাল্লাম উনার সম্মানার্থে মহান আল্লাহ পাক তিনি উহুদ জিহাদেও মুসলমান উনাদেরকে সুস্পষ্ট বিজয় দান করেন। কাজেই পবিত্র উহুদ জিহাদ নিয়ে ঐতিহাসিকরা যে সমস্ত মিথ্যা, ভিত্তিহীন মন্তব্য করে তা শুদ্ধ নয়। যেমন- উহুদ জিহাদে নাকি মুসলমানরা পরাজিত হয়েছেন। নাউযুবিল্লাহ! মুসলমান উনারা নাকি গণিমতের মালামাল লুট করতে গিয়ে আক্রান্ত হয়েছেন। নাউযুবিল্লাহ! ইত্যাদি। মূলত, বিশ্বের ইতিহাসে কোনো জিহাদে মুসলমান উনারা পরাজিত হননি, বরং প্রত্যেক জিহাদেই মুসলমান উনারা বিজয়ী হয়েছেন। এমনকি উহুদ জিহাদেও মুসলমান উনারাই বিজয়ী হয়েছেন। আর কাফিররাই পরাজিত হয়েছে। কেননা তারা যদি বিজয়ী হতো, তাহলে তারা গনিমত ও বন্দি লাভ করতো। কিন্তু যেহেতু তারা পরাজিত হয়েছে, সেহেতু তারা কোনো গনিমত পায়নি এবং কাউকে বন্দিও করতে পারেনি। বরং তারা পালিয়ে গেছে। কাজেই মুসলমান উনারাই বিজয়ী হয়েছেন। এবং উনারা গনিমতের মাল লাভ করেছেন এবং কাফিরদের কয়েকজনকে বন্দিও করেছেন। আর এটাই ছহীহ ও বিশুদ্ধ আক্বীদা।" 
            }
        };

        // বিস্তারিত দেখানো
        function showDetail(key) {
            const note = notes[key];
            document.getElementById('detail-title').innerText = note.title;
            document.getElementById('detail-text').innerText = note.content;
            
            // ব্যাক বাটন সেট করা
            document.getElementById('dynamic-back-btn').onclick = function() { 
                showSection(note.parent); 
            };
            
            showSection('detail-view');
        }
    </script>
</body>
</html>
